[package]
name = "javaboot-launcher"
version = "0.15.1"
description = "轻量 SpringBoot 启动器"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "javaboot_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-http = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = { version = "0.25", features = ["bundled"] }
tokio = { version = "1.0", features = ["sync", "time", "process", "io-util", "macros", "rt", "rt-multi-thread"] }
tokio-util = "0.7"
notify = "7.0"
sysinfo = "0.32"
quick-xml = "0.37"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "5.0"
parking_lot = "0.12"
once_cell = "1.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
encoding_rs = "0.8"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# ── 编译优化 ──
# dev：开发时主 crate 内部保持 opt-level 0 以保证快多次重编，
#      第三方依赖开 opt-level 1，避免 parking_lot / rusqlite / tokio 运行时卡。
[profile.dev]
opt-level = 0
incremental = true
debug = 1  # 只留行号，不需完整 debuginfo

[profile.dev.package."*"]
opt-level = 1

# release：体积 + 启动速度优先
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 不使用 panic = "abort"：任何库的 panic 都可能导致整个应用瞬间退出，
# 保留 unwind 让 tokio task 内的 panic 只终止该任务（或可被捕获记录）
