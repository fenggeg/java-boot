name: Build Windows x64 Setup

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# 同一 tag 重复推送 / 手动触发时避免并发构建。
# tag 发布构建不取消（避免覆盖进行中的发布）；手动触发可取消旧任务。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # CI 用不到增量编译，关闭减少 .rmeta 产物、缩短缓存恢复时间
  CARGO_INCREMENTAL: 0
  # 关闭 Rust 编译着色，减小日志体积
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 浅克隆：changelog 回退用 git log -20，深度 20 足够，无需全量历史
          fetch-depth: 20

      - name: Generate Release Notes
        id: release_notes
        shell: powershell
        run: |
          git fetch --tags --force

          $isTagRelease = "${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true"
          $currentTag = "${{ github.ref_name }}"
          $packageInfo = Get-Content package.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $releaseVersion = if ($isTagRelease) {
            $currentTag -replace '^v', ''
          } else {
            $packageInfo.version
          }
          $changelogPath = "CHANGELOG.md"

          function Get-ChangelogSection {
            param(
              [string] $Path,
              [string] $Version,
              [bool] $UseUnreleased
            )

            if (-not (Test-Path $Path)) {
              return ""
            }

            $lines = Get-Content $Path -Encoding UTF8
            $escapedVersion = [Regex]::Escape($Version)
            # 容忍 markdown 转义形式 `\[x.y]` / Unreleased（历史标题带反斜杠）
            $versionHeadingPattern = "^\s*##\s+\\?\[?v?$escapedVersion\\?\]?(?:\s+-\s+.*)?\s*$"
            $unreleasedHeadingPattern = "^\s*##\s+\\?\[?Unreleased\\?\]?\s*$"
            $headingPattern = if ($UseUnreleased) { $unreleasedHeadingPattern } else { $versionHeadingPattern }
            $capture = $false
            $section = New-Object System.Collections.Generic.List[string]

            foreach ($line in $lines) {
              if ($line -match $headingPattern) {
                $capture = $true
                continue
              }

              if ($capture -and $line -match "^\s*##\s+") {
                break
              }

              if ($capture) {
                $section.Add($line)
              }
            }

            return ($section -join "`n").Trim()
          }

          $notes = Get-ChangelogSection -Path $changelogPath -Version $releaseVersion -UseUnreleased:(!$isTagRelease)

          # 本项目暂无 CHANGELOG.md：缺失章节时回退到最近 20 条提交，不阻断构建
          # （引入 CHANGELOG.md 后，tag 发布要求存在对应 "## [x.y.z]" 章节，可再改为硬校验）
          if (-not $notes) {
              $commits = git log -20 --pretty=format:"- %s (%h)" |
                Where-Object { $_ -and $_.Trim() -ne "" }

              if (-not $commits -or $commits.Count -eq 0) {
                $commits = @("- This build contains generated artifacts.")
              }

              # 先 join 成字符串再拼接，避免数组元素被 ToString 成 System.Object[]
              $commitLines = $commits -join "`n"
              $notes = ("## Changes`n`n" + $commitLines).Trim()
            }

          $delimiter = "RELEASE_NOTES_" + [Guid]::NewGuid().ToString("N")
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "$delimiter" >> $env:GITHUB_OUTPUT

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Rust 编译缓存（最关键优化）：命中后 release 编译从十几分钟降到分钟级。
      # 注意：缓存 key 含 Cargo.lock 哈希，发版改版本号会使 lock 变化而 miss；
      # 但对同版本重试 / 手动构建 / 未来 push 构建仍有显著收益。
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true

      - name: Install Dependencies
        run: npm ci

      - name: Build Tauri App (NSIS x64 Setup Only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI: true
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'windows-auto-build' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('JavaBoot Launcher {0}', github.ref_name) || 'JavaBoot Launcher Auto Build' }}
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: ${{ !startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          args: --ci --bundles nsis
          uploadPlainBinary: false
          retryAttempts: 2

      - name: Prepare x64 Setup EXE
        shell: powershell
        run: |
          $bundleDir = "src-tauri\target\release\bundle\nsis"

          if (-not (Test-Path $bundleDir)) {
            Write-Error -Message "NSIS bundle directory not found: $bundleDir"
            exit 1
          }

          $setupFiles = Get-ChildItem -Path $bundleDir -Filter "*setup*.exe" -File

          if (-not $setupFiles -or $setupFiles.Count -eq 0) {
            Write-Error -Message "No NSIS setup EXE found in $bundleDir"
            Get-ChildItem -Path $bundleDir | Select-Object FullName
            exit 1
          }

          $sourceExe = ($setupFiles | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force -Path "release-dist" | Out-Null

          $setupName = "JavaBoot.Launcher_x64-setup.exe"
          Copy-Item $sourceExe "release-dist\$setupName" -Force

          Write-Host "Setup EXE prepared: release-dist\$setupName"

      - name: Upload x64 Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JavaBoot-Launcher-x64-setup
          path: release-dist/*.exe
      # 说明：GitHub Release 由上面的 tauri-action 统一创建并上传 NSIS 安装包
      # （tagName / releaseName / releaseBody / generateReleaseNotes 均已配置）。
      # 曾额外用 softprops/action-gh-release 再上传一次，导致与 tauri-action 争抢
      # 同一 tag 的 Release（找不到 → 再创建 → "Resource not accessible" 403），
      # v0.19.2 即因此发布失败。现已移除该冗余步骤。
